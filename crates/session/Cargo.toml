[package]
name = "glossql-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glossql-parser = { path = "../parser" }
glossql-glossary = { path = "../glossary" }
# No backend feature: the library runs on the `Lake`, whichever
# constructor built it. The binary picks the backend; the suite's
# fixtures get `sql` through the dev-dependency below.
glossql-catalog = { path = "../catalog", default-features = false }
glossql-import = { path = "../import" }
datafusion.workspace = true
datafusion-functions-json.workspace = true
arrow-json.workspace = true
futures.workspace = true
chrono.workspace = true
serde_json.workspace = true
moka.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true

[dev-dependencies]
glossql-catalog = { path = "../catalog" }
tokio.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
