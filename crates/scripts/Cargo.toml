[package]
name = "glossql-scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glossql-session = { path = "../session" }
datafusion.workspace = true
arrow-json.workspace = true
serde_json.workspace = true
# The statistical kernels' algebra (reconcile's convention product).
faer.workspace = true
thiserror.workspace = true
# The service behind a point — Arrow IPC over HTTP on the rustls
# reqwest the server already rides. The server carries no model: a
# point's table call goes to the service `GLOSSQL_<POINT>_URL` names.
reqwest.workspace = true
arrow-ipc.workspace = true
bytes.workspace = true
# The wait a full service queue asks for.
tokio = { workspace = true, features = ["time", "sync"] }
# An ID token's expiry, read off its payload to time the refresh.
base64.workspace = true

[dev-dependencies]
glossql-glossary = { path = "../glossary" }
glossql-catalog = { path = "../catalog" }
tokio.workspace = true
tempfile.workspace = true
futures.workspace = true
# The suite's stand-in service.
axum.workspace = true

[lints]
workspace = true
