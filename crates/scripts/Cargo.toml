[package]
name = "glossql-scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glossql-session = { path = "../session" }
datafusion.workspace = true
arrow-json.workspace = true
serde.workspace = true
serde_json.workspace = true
# The statistical kernels' algebra (reconcile's convention product).
faer.workspace = true
thiserror.workspace = true
# The kernel service behind the three model reads — JSON over HTTP on
# the rustls reqwest the server already rides. The server carries no
# model: the reads go to the service `GLOSSQL_TABICL_URL` names.
reqwest.workspace = true
# The wait a full kernel queue asks for.
tokio = { workspace = true, features = ["time", "sync"] }
# An ID token's expiry, read off its payload to time the refresh.
base64.workspace = true

[dev-dependencies]
glossql-glossary = { path = "../glossary" }
glossql-catalog = { path = "../catalog" }
tokio.workspace = true
tempfile.workspace = true
futures.workspace = true
# The suite's stand-in kernel service.
axum.workspace = true

[lints]
workspace = true
