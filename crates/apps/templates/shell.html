<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"globalViewTransitions":true}'>
<title>{% block title %}{% if app %}{{ app.title }}{% else %}glossql{% endif %}{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23171d26'/%3E%3Ctext x='8' y='12' text-anchor='middle' font-family='monospace' font-size='11' fill='%23e2a33f'%3Eg%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/assets/app.css">
<script src="/app/assets/vendor/htmx.min.js"></script>
<script src="/app/assets/vendor/vega.min.js"></script>
<script src="/app/assets/vendor/vega-lite.min.js"></script>
<script src="/app/assets/vendor/vega-embed.min.js"></script>
<script src="/app/assets/vendor/arrow.min.js"></script>
<script src="/app/assets/store.js"></script>
<script src="/app/assets/gl-chart.js"></script>
<script src="/app/assets/gl-table.js"></script>
<script src="/app/assets/gl-value.js"></script>
<script src="/app/assets/gl-rows.js"></script>
</head>
<body hx-boost="true" hx-indicator=".load-bar"{% if app %} data-approot="/app/{{ app.name }}/"{% endif %}>
<header class="shell-nav">
  <a class="brand" href="/app">glossql</a>
  {% if app %}<span class="app-title">{{ app.title }}</span>{% endif %}
  <nav>
    {% for a in apps %}{% if not app or a.name != app.name %}<a href="/app/{{ a.name }}">{{ a.title }}</a>{% endif %}{% endfor %}
    <a{% if not app %} class="current"{% endif %} href="/app">Apps</a>
  </nav>
</header>
<div class="load-bar"></div>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
