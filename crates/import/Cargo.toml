[package]
name = "glossql-import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glossql_import"
path = "src/lib.rs"

[dependencies]
datafusion = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
# try_to_date/try_to_timestamp parse with the same chrono arrow already uses.
chrono = { workspace = true }
thiserror = { workspace = true }
# `sync`: the channel a relational source's blocking driver feeds.
tokio = { workspace = true, features = ["sync"] }
adbc_core = { workspace = true }
adbc_driver_manager = { workspace = true }
# A file source's root in an object store: the storage seam's clients.
glossql-catalog = { path = "../catalog" }
object_store = { workspace = true }
url = { workspace = true }
# A glob under a remote root is the application's to split (datafusion-datasource url.rs, `try_new`).
glob = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
