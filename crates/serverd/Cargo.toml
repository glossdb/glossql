[package]
name = "glossql-serverd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "serverd"
path = "src/main.rs"

# Which catalog backend the binary carries — the default carries both
# and the environment picks at start (`GLOSSQL_CATALOG_URI` set =
# rest). A rest-only build (`--no-default-features --features rest`)
# leaves sqlite and sqlx out of the binary; a sql-only one
# (`--no-default-features --features sql`) leaves the REST client and
# the S3 stack out.
[features]
default = ["sql", "rest"]
sql = ["glossql-catalog/sql"]
rest = ["glossql-catalog/rest"]
# The release-artifact switches, forwarded to glossql-scripts: cuda is
# the Linux GPU flavor (needs the NVIDIA driver and CUDA 12 runtime
# libraries at load), embed-weights bakes the regressor into the binary
# so the artifact is one self-contained file.
cuda = ["glossql-scripts/cuda"]
embed-weights = ["glossql-scripts/embed-weights"]

[dependencies]
glossql-glossary = { path = "../glossary" }
glossql-session = { path = "../session" }
glossql-apps = { path = "../apps" }
glossql-catalog = { path = "../catalog", default-features = false }
glossql-scripts = { path = "../scripts" }
datafusion = { workspace = true }
arrow-ipc = { workspace = true }
arrow-json = { workspace = true }
axum = { workspace = true }
futures.workspace = true
rmcp = { workspace = true }
serde_json = { workspace = true }
# `signal`: the server stops on SIGINT/SIGTERM through its own exit,
# so the record is flushed before the process is gone.
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tower-http = { workspace = true }
opentelemetry-http = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The two fetches a resource server makes: the issuer's discovery
# document and its key set. reqwest is already in the tree through
# iceberg, without a TLS backend; the issuer speaks HTTPS, so one is
# named here. rustls: pure Rust, no system library, the same in a
# container as on a laptop.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The authorization configuration lives in `.env` (or the environment),
# not in flags: issuer, audience, client id and secret are one
# arrangement, and the secret must never appear on a command line.
dotenvy = "0.15"
# The browser login on /app: this server is an OAuth client of the
# issuer for that one flow (authorization code + PKCE). The crate rmcp's
# own auth feature is built on; its reqwest rides the same rustls.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# The login-in-progress cookie: three strings sealed for the round trip
# to the issuer and back.
base64 = "0.22"
serde = { workspace = true, features = ["derive"] }
# HTTPS for the doors (a desktop MCP client connects https only):
# tokio-rustls over the same rustls reqwest already rides — ring, so
# no second crypto provider is built — and hyper-util, already under
# axum. The accept loop is axum's own low-level-rustls example; no
# serving crate on top.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rustls-pki-types = "1"

[dev-dependencies]
glossql-parser = { path = "../parser" }
tower.workspace = true
tempfile.workspace = true
# Tests mint their own tokens with a key made at test time; the server
# only ever verifies. Already in the tree through jsonwebtoken.
ed25519-dalek = { version = "2", features = ["pkcs8"] }

[lints]
workspace = true

# How the Linux artifacts are assembled: `cargo deb -p glossql-serverd
# --no-build` over a binary built with `--release --features
# embed-weights` (plus `cuda` and `--variant cuda` for the GPU flavor).
# The binary is the whole package — weights ride inside it.
[package.metadata.deb]
name = "glossql"
maintainer = "glossdb <phas02@users.noreply.github.com>"
copyright = "glossql contributors, Apache-2.0"
extended-description = """serverd is one binary serving one glossql workspace: the SQL-shaped
surface over a workspace's data and its context. Runs the TabICL band
model on CPU."""
section = "database"
priority = "optional"
assets = [["target/release/serverd", "usr/bin/serverd", "755"]]

[package.metadata.deb.variants.cuda]
name = "glossql-cuda"
provides = "glossql"
conflicts = "glossql"
replaces = "glossql"
# Not $auto: dpkg-shlibdeps would pin the NVIDIA runtime to the exact
# minor packages of the build machine. The CUDA requirement is stated,
# not resolved: driver (libcuda), cudart, cublas, nvrtc, curand from a
# CUDA 12 installation.
depends = "libc6, libgcc-s1, libstdc++6"
extended-description = """serverd is one binary serving one glossql workspace: the SQL-shaped
surface over a workspace's data and its context. This flavor runs the
TabICL band model on an NVIDIA GPU (device 0, CPU fallback) and loads
only where the NVIDIA driver and the CUDA 12 runtime libraries
(cudart, cublas, nvrtc, curand) are installed; on machines without
them, install glossql instead."""
