[package]
name = "glossql-serverd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glossql"
path = "src/main.rs"

# No model rides the binary: the three model doors call the kernel
# service `GLOSSQL_TABICL_URL` names.

[dependencies]
glossql-glossary = { path = "../glossary" }
glossql-session = { path = "../session" }
glossql-apps = { path = "../apps" }
glossql-catalog = { path = "../catalog" }
glossql-scripts = { path = "../scripts" }
glossql-parser = { path = "../parser" }
datafusion = { workspace = true }
arrow-json = { workspace = true }
axum = { workspace = true }
futures.workspace = true
rmcp = { workspace = true }
serde_json = { workspace = true }
# `signal`: the server stops on SIGINT/SIGTERM through its own exit,
# so the record is flushed before the process is gone.
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tower-http = { workspace = true }
opentelemetry-http = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The two fetches a resource server makes: the issuer's discovery
# document and its key set (the workspace line names the client).
reqwest.workspace = true
# The authorization configuration lives in `.env` (or the environment),
# not in flags: issuer, audience, client id and secret are one
# arrangement, and the secret must never appear on a command line.
dotenvy = "0.15"
# The browser login on /app: this server is an OAuth client of the
# issuer for that one flow (authorization code + PKCE). The crate rmcp's
# own auth feature is built on; its reqwest rides the same rustls.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# The login-in-progress cookie: three strings sealed for the round trip
# to the issuer and back.
base64 = "0.22"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
arrow-ipc = { workspace = true }
tower.workspace = true
tempfile.workspace = true
# Tests mint their own tokens with a key made at test time; the server
# only ever verifies. Already in the tree through jsonwebtoken.
ed25519-dalek = { version = "2", features = ["pkcs8"] }

[lints]
workspace = true
