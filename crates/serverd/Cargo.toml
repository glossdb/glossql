[package]
name = "glossql-serverd"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "serverd"
path = "src/main.rs"

[dependencies]
glossql-glossary = { path = "../glossary" }
glossql-session = { path = "../session" }
glossql-apps = { path = "../apps" }
glossql-catalog = { path = "../catalog" }
glossql-scripts = { path = "../scripts" }
datafusion = { workspace = true }
arrow-ipc = { workspace = true }
arrow-json = { workspace = true }
axum = { workspace = true }
futures.workspace = true
rmcp = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
glossql-parser = { path = "../parser" }
tower.workspace = true
tempfile.workspace = true

[lints]
workspace = true
