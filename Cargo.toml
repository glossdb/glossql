[workspace]
resolver = "3"
members = ["crates/parser", "crates/glossary", "crates/session", "crates/catalog", "crates/import", "crates/scripts", "crates/apps", "crates/serverd"]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
# macOS ld notes that datafusion-sized debug binaries outgrow the compact
# unwind table (__eh_frame > 16MB) — an exception-handling performance
# note, nothing actionable; every crate opts in via [lints] workspace.
linker_messages = "allow"

[workspace.dependencies]
# 53.1 is the newest datafusion supported by iceberg-datafusion (0.10.1 pins
# ^53.1); the whole workspace moves in lockstep or trait impls stop lining up.
# The same rule binds sqlx to iceberg-catalog-sql (0.10.1 pins ^0.8): one sqlx
# in the tree, or the Any driver never learns about sqlite.
datafusion = { version = "53.1", default-features = false, features = ["parquet", "sql"] }
datafusion-sql = "53.1"
datafusion-common = "53.1"
datafusion-functions-json = "0.53"
iceberg = "0.10.1"
iceberg-catalog-sql = "0.10.1"
iceberg-datafusion = "0.10.1"
serde_json = "1"
# arrow-ipc/arrow-json ride the arrow that datafusion 53.1 pins (58.4) — the
# same lockstep rule as above; bumping either alone splits the arrow tree.
arrow-ipc = "58.4"
arrow-json = "58.4"
axum = "0.8"
rmcp = { version = "3.1", features = ["transport-streamable-http-server"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
# The TabICL port rides as a sibling link (ruled 2026-08-11) — the repo
# stays its own publishable unit; weights are never in git and load
# digest-verified from the workspace's weights/ directory.
tabicl-candle = { path = "../tabicl-candle" }
jsonschema = { version = "0.49", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
insta = "1"
