[workspace]
resolver = "3"
members = ["crates/parser", "crates/glossary", "crates/session", "crates/catalog", "crates/import", "crates/scripts", "crates/apps", "crates/serverd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/glossdb/glossql"

[workspace.lints.rust]
# macOS ld notes that datafusion-sized debug binaries outgrow the compact
# unwind table (__eh_frame > 16MB) — an exception-handling performance
# note, nothing actionable; every crate opts in via [lints] workspace.
linker_messages = "allow"

# What a memory bug looks like at compile time, so nobody has to find it
# with a stack overflow or a profiler. A future above 16 KB is boxed
# (the planner recursion has overflowed a 2 MB test thread before); a
# clone the borrow checker did not need is a copy. `unwrap_used` — a
# panic waiting for the row that has it — is `#![warn]`ed in each
# library and binary root instead: a lint here would reach the
# integration tests, where a panic is the assertion.
[workspace.lints.clippy]
large_futures = "warn"
redundant_clone = "warn"

# The released binary: symbols stripped (a quarter of the size back;
# the spans and events are the observability story, not backtrace names).
[profile.release]
strip = true

# Every test binary statically links datafusion + candle — one suite per
# crate (tests/suite/main.rs) plus the unit-test binaries; with default
# full debug info that was ~0.5GB per binary × every test target ×
# every stale hashed copy — a target/ in the hundreds of GB and an AV scan
# per link. Line tables keep workspace backtraces (file:line); dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
# adbc rides the engine's arrow. Its own requirement spans two arrow
# majors (>=58, <60), so a bare `cargo update` can split the tree by
# resolving it to the newer one — and the import seam shares
# RecordBatch types with datafusion, so a split does not compile.
# After an update, converge the duplicate back onto the engine's copy:
# `cargo update arrow-array@<added> --precise <the engine's>`.
adbc_core = "0.24"
adbc_driver_manager = "0.24"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
# SPIKE 2026-08-17 — iceberg-rust main, to reach v3 row lineage on read
# (`_last_updated_sequence_number`, PR #2966, merged 2026-08-10, in no
# release; 0.10.1 was cut 2026-08-01). main pins datafusion 54.1 and the
# same arrow 58.4, so the arrow tree does not split. REVERT if not kept.
datafusion = { version = "54.1", default-features = false, features = ["parquet", "sql"] }
datafusion-sql = "54.1"
datafusion-common = "54.1"
datafusion-functions-json = "0.54"
iceberg = { git = "https://github.com/apache/iceberg-rust", branch = "main" }
iceberg-catalog-sql = { git = "https://github.com/apache/iceberg-rust", branch = "main" }
# Not used directly since stage 4½ — this line exists to switch on
# sqlx's tokio runtime for iceberg-catalog-sql, which names no runtime
# feature of its own and panics at pool creation without one.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
iceberg-datafusion = { git = "https://github.com/apache/iceberg-rust", branch = "main" }
# The `rest` catalog backend (glossql-catalog's `rest` feature): the
# Iceberg REST client. Its data plane is our own `Storage` over
# object_store — the crate DataFusion already runs on — so the binary
# carries one storage stack; `aws` adds the S3 family. typetag is
# iceberg's registration mechanism for storage implementations.
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", branch = "main" }
object_store = { version = "0.13", features = ["aws"] }
typetag = "0.2"
bytes = "1"
serde_json = "1"
# The cube cache (crates/session/src/cube.rs): moka is already in the
# tree through iceberg-rust, at this version; its ObjectCache is their
# metadata seam, not reusable.
moka = { version = "0.12", features = ["future"] }
# arrow-ipc/arrow-json ride the arrow that datafusion 53.1 pins (58.4) — the
# same lockstep rule as above; bumping either alone splits the arrow tree.
arrow-ipc = "58.4"
arrow-json = "58.4"
axum = "0.8"
rmcp = { version = "3.1", features = ["transport-streamable-http-server", "elicitation"] }
# The TabICL port rides as a sibling link (ruled 2026-08-11) — the repo
# stays its own publishable unit, split into the model (the forward,
# the donation candidate) and inference (preprocessing, what this
# workspace embeds); weights are never in git and load from the
# workspace's weights/ directory. Digest verification lives where
# bytes enter — the package/build step, not the loader. A release
# build bakes the regressor into the binary (glossql-scripts'
# embed-weights feature).
tabicl-model = { path = "../tabicl-candle/crates/tabicl-model" }
tabicl-inference = { path = "../tabicl-candle/crates/tabicl-inference" }
jsonschema = { version = "0.49", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
insta = "1"
async-trait = "0.1"
# The header/status types the REST catalog client speaks; already in
# the tree under axum, reqwest and iceberg.
http = "1"
faer = "0.22"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tera = { version = "1", default-features = false }
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Instrumentation. `tracing` is the facade every crate emits through —
# already in the tree via axum, rmcp, iceberg and sqlx; the subscriber
# is installed once, at the process edge (serverd). blake3 is in the
# tree through iceberg; it keys a call's spans to its text by digest.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
blake3 = "1"
# The OTLP export (crates/serverd/src/telemetry.rs): the same spans and
# events, sent to a collector when `OTEL_EXPORTER_OTLP_ENDPOINT` is set.
# opentelemetry-rust, traces only, protobuf over HTTP through the
# reqwest already in the tree; tracing-opentelemetry is the bridge from
# `tracing` spans to theirs and pins the opentelemetry it works with.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
# The exporter's own client. It rides reqwest 0.13 while iceberg-rust
# (main, 0.12.12) and oauth2 5 pin 0.12, so the tree carries both. The
# way back to one: oauth2-reqwest (same author, reqwest 0.13, alpha as
# of 0.1.0-alpha.3) for the login, once iceberg-rust has moved too. The
# SDK exports from its own thread, which is why the blocking client fits.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
# The bridge from `tracing` events to the SDK's log records.
opentelemetry-appender-tracing = "0.32"
# The request span on every door, and the `traceparent` a client sends
# becoming its parent. tower-http is in the tree through reqwest.
tower-http = { version = "0.6", features = ["trace"] }
opentelemetry-http = "0.32"
tracing-opentelemetry = "0.33"
