[workspace]
resolver = "3"
members = ["crates/parser", "crates/glossary", "crates/session", "crates/catalog", "crates/import", "crates/scripts", "crates/apps", "crates/serverd"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/glossdb/glossql"

[workspace.lints.rust]
# macOS ld notes that datafusion-sized debug binaries outgrow the compact
# unwind table (__eh_frame > 16MB) — an exception-handling performance
# note, nothing actionable; every crate opts in via [lints] workspace.
linker_messages = "allow"

# What a memory bug looks like at compile time, so nobody has to find it
# with a stack overflow or a profiler. A future above 16 KB is boxed
# (the planner recursion has overflowed a 2 MB test thread before); a
# clone the borrow checker did not need is a copy. `unwrap_used` — a
# panic waiting for the row that has it — is `#![warn]`ed in each
# library and binary root instead: a lint here would reach the
# integration tests, where a panic is the assertion.
[workspace.lints.clippy]
large_futures = "warn"
redundant_clone = "warn"

# The released binary: symbols stripped (a quarter of the size back;
# the spans and events are the observability story, not backtrace names).
[profile.release]
strip = true

# Every test binary statically links datafusion + candle — one suite per
# crate (tests/suite/main.rs) plus the unit-test binaries; with default
# full debug info that was ~0.5GB per binary × every test target ×
# every stale hashed copy — a target/ in the hundreds of GB and an AV scan
# per link. Line tables keep workspace backtraces (file:line); dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
# adbc rides the engine's arrow. Its own requirement spans two arrow
# majors (>=58, <60), so a bare `cargo update` can split the tree by
# resolving it to the newer one — and the import seam shares
# RecordBatch types with datafusion, so a split does not compile.
# After an update, converge the duplicate back onto the engine's copy:
# `cargo update arrow-array@<added> --precise <the engine's>`.
adbc_core = "0.24"
adbc_driver_manager = "0.24"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
# datafusion at the major its lockstep siblings release for: the
# planner, the parquet scan and sink, and the function libraries the
# engine ships by default (the crate's own default set, named here
# because `default-features = false` keeps the workspace choosing).
datafusion = { version = "55.1", default-features = false, features = ["parquet", "sql", "compression", "recursive_protection", "nested_expressions", "crypto_expressions", "datetime_expressions", "encoding_expressions", "regex_expressions", "string_expressions", "unicode_expressions"] }
datafusion-sql = "55.1"
datafusion-common = "55.1"
datafusion-functions-json = "0.55"
# The catalog tables and the record's relations, on one database. Two
# drivers: SQLite for the workspace directory, Postgres for the cloud
# (`GLOSSQL_CATALOG_SQL`); `any` is the driver both sit behind;
# `tls-rustls` is rustls on ring, the provider the rest of the tree
# already carries.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls"] }
# The warehouse's object store — the crate DataFusion already runs on,
# so the binary carries one storage stack: `aws` is the S3 family,
# `azure` the ADLS/Blob family (Container Apps' managed identity is
# read by that client), `gcp` Google Cloud Storage (the attached
# service account's token is read from the metadata server by that
# client).
object_store = { version = "0.13", features = ["aws", "azure", "gcp"] }
# The engine's own glob crate, for the glob a remote source path carries.
glob = "0.3"
# Whole-location parsing for the storage seam; in the tree under object_store.
url = "2"
bytes = "1"
# `preserve_order`: a JSON object keeps its authored key order.
# datafusion-physical-plan 55 switches it on for every workspace build;
# named here so a single crate built alone orders the same way.
serde_json = { version = "1", features = ["preserve_order"] }
# The cube cache (crates/session/src/cube.rs).
moka = { version = "0.12", features = ["future"] }
# arrow-ipc/arrow-json ride the arrow that datafusion 55 pins (59.2) — the
# same lockstep rule as above; bumping either alone splits the arrow tree.
arrow-ipc = "59.2"
arrow-json = "59.2"
axum = "0.8"
rmcp = { version = "3.1", features = ["transport-streamable-http-server", "elicitation"] }
jsonschema = { version = "0.56", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
insta = "1"
async-trait = "0.1"
# The header/status types the storage seam speaks; already in the tree
# under axum and reqwest.
http = "1"
faer = "0.24"
serde = { version = "1", features = ["derive"] }
tera = { version = "1", default-features = false }
toml = "1"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# The HTTP client the server makes its own calls with: the issuer's
# discovery document and key set (serverd), and the kernel service
# behind the model reads (glossql-scripts). rustls names the TLS
# backend — pure Rust, the same in a container as on a laptop.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Instrumentation. `tracing` is the facade every crate emits through —
# already in the tree via axum, rmcp and sqlx; the subscriber is
# installed once, at the process edge (serverd). blake3 keys a call's
# spans to its text by digest.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
blake3 = "1"
# The OTLP export (crates/serverd/src/telemetry.rs): the same spans and
# events, sent to a collector when `OTEL_EXPORTER_OTLP_ENDPOINT` is set.
# opentelemetry-rust, traces only, protobuf over HTTP through the
# reqwest already in the tree; tracing-opentelemetry is the bridge from
# `tracing` spans to theirs and pins the opentelemetry it works with.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
# The exporter's clients, one per transport OTEL_EXPORTER_OTLP_PROTOCOL
# names: protobuf over HTTP on reqwest, and gRPC on tonic — what a
# platform's managed collector speaks (Container Apps' agent takes
# gRPC alone). reqwest here is 0.13 while object_store 0.13 (the one
# datafusion 55 pins) and oauth2 5 require 0.12, so
# the tree carries both. The way back to one: object_store 0.14
# (reqwest 0.13) reaching datafusion, then the login
# through a reqwest 0.13 client (oauth2-reqwest, alpha as of
# 0.1.0-alpha.3, or oauth2's own client trait). The SDK exports from
# its own thread, which is why the blocking HTTP client fits; the gRPC
# channel spawns its connection onto the runtime it is built in.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client", "grpc-tonic"] }
# The bridge from `tracing` events to the SDK's log records.
opentelemetry-appender-tracing = "0.32"
# The request span on every door, and the `traceparent` a client sends
# becoming its parent. tower-http is in the tree through reqwest.
tower-http = { version = "0.6", features = ["trace"] }
opentelemetry-http = "0.32"
tracing-opentelemetry = "0.33"
