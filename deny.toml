# The dependency rules the ci workflow holds (`cargo deny check`):
# advisories, licences, duplicates and sources. The lockstep rule —
# one arrow, one datafusion, one parquet in the tree — is a test in
# the serverd suite (tests/suite/conformance.rs), so `cargo test`
# holds it on a laptop too.

[graph]
# The two targets a build runs for: the image and the laptop.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # quick-xml under object_store 0.13, the version datafusion 55 pins:
  # a quadratic attribute check on a start tag, reachable only through
  # the XML the configured store answers with. Closes when object_store
  # 0.14 reaches datafusion.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml rides object_store 0.13, pinned by the engine; the XML parsed is the store's own answers" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml rides object_store 0.13, pinned by the engine; the XML parsed is the store's own answers" },
  # rsa under jsonwebtoken: the timing side channel is in private-key
  # operations, and this server only verifies with the issuer's public
  # keys — it holds no RSA private key.
  { id = "RUSTSEC-2023-0071", reason = "rsa rides jsonwebtoken; the server verifies with public keys and never signs" },
  # paste is a proc-macro that runs at build time, under
  # datafusion-functions-json and faer's gemm; unmaintained, not unsound.
  { id = "RUSTSEC-2024-0436", reason = "paste is a build-time proc-macro under the engine's JSON functions and faer" },
  # crypto-bigint 0.5 under jsonwebtoken's p256 and p384 0.13: timing
  # variability in operations meant to be constant-time. The server
  # verifies with the issuer's public keys and never signs. Closes when
  # jsonwebtoken moves to p256 0.14.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint rides jsonwebtoken's p256 0.13; the server verifies with public keys and never signs" },
  # zstd 0.13 and zstd-safe 7 under arrow 59 and datafusion 55, the
  # versions the engine pins; the readers are arrow-ipc, parquet and the
  # datasource, every one with zstd's default features off. The abandoned
  # stream needs a stream built on a borrowed context: arrow-ipc and
  # parquet use the bulk API, the datasource the read-side decoder with a
  # context of its own. The seekable API is never called and its feature
  # is off. The legacy frame needs the streaming write-side decoder and
  # legacy support compiled in; the readers use the bulk API and the
  # read-side decoder, which the advisory exempts, and legacy is off.
  # Closes when arrow 60 reaches datafusion.
  { id = "RUSTSEC-2026-0391", reason = "zstd rides arrow 59 and datafusion 55, pinned by the engine; no reader builds a stream on a borrowed context" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe rides arrow 59 and datafusion 55, pinned by the engine; the seekable API is never called and its feature is off" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe rides arrow 59 and datafusion 55, pinned by the engine; the readers use the bulk API and the read-side decoder, and legacy frames are not compiled in" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unlicense", "MIT-0",
  "0BSD", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "bzip2-1.0.6",
]

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# A second version of a crate is a warning here; the arrow and
# datafusion tree is the one that must not split, and the conformance
# test fails on it.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates reference each other by path.
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "rustls everywhere; the distroless image has no libssl" },
  { crate = "native-tls", reason = "rustls everywhere" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
