# The dev rig: the backends the server can stand on, as one compose,
# for the live tests and for a laptop running the server against
# something other than its workspace directory: Postgres 18 (the SQL
# catalog; init.sql makes its two databases) and Azurite (an Azure
# warehouse; azurite-container.py makes the `lake` container). The
# commands and the variables each arrangement takes: README.md.
name: glossql-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: glossql
      POSTGRES_PASSWORD: glossql
      POSTGRES_DB: glossql
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossql"]
      interval: 2s
      timeout: 2s
      retries: 15
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # `--skipApiVersionCheck`: object_store asks with a newer API
    # version than the emulator names; the calls it makes are old.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports: ["127.0.0.1:10000:10000"]
    volumes:
      - azurite:/data
  azurite-init:
    image: python:3.13-alpine
    command: python /azurite-container.py lake
    environment:
      AZURITE_HOST: azurite:10000
    volumes:
      - ./azurite-container.py:/azurite-container.py:ro
    depends_on: [azurite]

volumes:
  postgres:
  azurite:
