# What moves on its own: the actions by commit, the image bases by
# digest, the crates on their lines, and the browser libraries through
# the manifest beside the vendor table. The engine's lockstep set —
# arrow, datafusion, parquet, object_store, adbc — moves by hand, at a
# pin move, with the vendored SQL guide refreshed (Cargo.toml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "arrow*"
      - dependency-name: "datafusion*"
      - dependency-name: "parquet"
      - dependency-name: "object_store"
      - dependency-name: "adbc*"
      # tera stays on its 1 line: the agents write the page snippets
      # in its syntax (Cargo.toml).
      - dependency-name: "tera"
        update-types: ["version-update:semver-major"]
      # ed25519-dalek is a serverd dev-dependency that follows
      # jsonwebtoken's pin, so one copy is in the tree; it moves when
      # jsonwebtoken does (crates/serverd/Cargo.toml).
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-major"]
    groups:
      crates:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /crates/apps/assets/vendor
    schedule:
      interval: weekly
