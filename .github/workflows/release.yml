# The release build: one Debian package (x86_64; ARM is not a target)
# and the server image, assembled when a v* tag is pushed (or built,
# not published, on manual dispatch). The macOS artifact is built on a
# laptop — .github/release-macos.sh — and the tap formula points at it.
# This is not CI: nothing here runs on push, the test suite gates
# changes locally. Nothing built here carries a model: the band model
# is the glosskernels service, released from its own repository.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p glossql-serverd
      - name: smoke
        run: target/release/glossql --version
      - name: package
        run: |
          cargo install cargo-deb --locked
          cargo deb -p glossql-serverd --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ runner.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --verify-tag --title "$tag" --notes "" \
            || true
          gh release upload "$tag" target/debian/*.deb --clobber

  # The image is the Dockerfile at the tag, built from source on the
  # runner (its own compile: the deb's binary is Ubuntu's glibc, the
  # image's is Debian's) and pushed as ghcr.io/glossdb/glossql:<version>
  # plus :latest. A dispatch run builds it and pushes nothing.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
