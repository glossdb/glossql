# The release build: the server image, assembled when a v* tag is
# pushed. A manual dispatch pushes the image by branch and commit — a
# deployment pins a commit between releases. The macOS artifact is built
# on a laptop — .github/release-macos.sh — and the tap formula points at
# it; the script also opens the draft release.
# This is not CI: nothing here runs on push, the test suite gates
# changes locally. Nothing built here carries a model: the band model
# is the glosskernels service, released from its own repository.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The image is the Dockerfile at the tag, built from source on the
  # runner and pushed as ghcr.io/glossdb/glossql:<version> plus :latest.
  # A dispatch run pushes :<branch> and :sha-<commit>; :latest moves at
  # a tag only.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
