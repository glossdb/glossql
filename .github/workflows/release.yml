# The release build: the server image, assembled when a v* tag is
# pushed. A manual dispatch pushes the image by branch and commit — a
# deployment pins a commit between releases. The macOS artifact is built
# on a laptop — .github/release-macos.sh — and the tap formula points at
# it; the script also opens the draft release.
# This is not CI: ci.yml runs the suite on every push and pull
# request, and a tag is cut from a commit it ran green on. Nothing
# built here carries a model: the forecast model is glossthesi,
# released from its own repository.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The image is the Dockerfile at the tag, built from source on the
  # runner and pushed as ghcr.io/glossdb/glossql:<version> plus :latest.
  # A dispatch run pushes :<branch> and :sha-<commit>; :latest moves at
  # a tag only.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The layer cache in the actions cache: a tag build compiles
          # what moved since the last one.
          cache-from: type=gha
          cache-to: type=gha,mode=max
