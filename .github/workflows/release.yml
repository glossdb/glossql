# The release build: one Debian package (x86_64; ARM is not a target)
# assembled when a v* tag is pushed (or on manual dispatch). The macOS
# artifact is built on a laptop — .github/release-macos.sh — and the
# tap formula points at it. This is not CI: nothing here runs on push,
# the test suite gates changes locally. The binary carries no model:
# the band model is the glosskernels service, released from its own
# repository.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p glossql-serverd
      - name: smoke
        run: target/release/glossql --version
      - name: package
        run: |
          cargo install cargo-deb --locked
          cargo deb -p glossql-serverd --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ runner.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --verify-tag --title "$tag" --notes "" \
            || true
          gh release upload "$tag" target/debian/*.deb --clobber
